name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BIN_NAME: rusty-rain

jobs:
  check:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag with Cargo.toml
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          manifest="$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)"
          if [ "$version" != "$manifest" ]; then
            echo "tag $tag does not match Cargo.toml version $manifest" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            packages: musl-tools
            deb: amd64
          - target: i686-unknown-linux-gnu
            os: ubuntu-latest
            packages: gcc-multilib
            deb: i386
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            packages: gcc-mingw-w64-x86-64
            ext: .exe
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install system packages
        if: matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage binary
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BIN_NAME}${{ matrix.ext }}" \
            "dist/${{ matrix.target }}-${BIN_NAME}-${{ needs.check.outputs.tag }}${{ matrix.ext }}"
      - name: Install cargo-deb
        if: matrix.deb != ''
        run: cargo install cargo-deb --locked
      - name: Package deb
        if: matrix.deb != ''
        run: |
          cargo deb --no-build --target ${{ matrix.target }}
          deb="$(find target -name '*.deb' -print -quit)"
          if [ -z "$deb" ]; then
            echo "cargo deb produced no package" >&2
            exit 1
          fi
          mv "$deb" "dist/${BIN_NAME}_${{ needs.check.outputs.tag }}-1_${{ matrix.deb }}.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List assets
        run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: ${{ needs.check.outputs.tag }}
          generate_release_notes: true
          files: dist/*

  publish-crate:
    name: Publish to crates.io
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  docker:
    name: Publish container image
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
